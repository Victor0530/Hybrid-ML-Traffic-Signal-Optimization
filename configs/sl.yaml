# Supervised-learning configuration (Milestone 3).
#
# Simulation duration, sampling interval and prediction horizon are read from
# configs/traffic_scenarios.yaml so there is a single source of truth.
#
# Usage:
#   python -m src.preprocessing.build_dataset --config configs/sl.yaml

data:
  raw_dir: data/raw
  manifest: data/raw/run_manifest.csv
  processed_dir: data/processed
  splits_dir: data/processed/splits

traffic_config: configs/traffic_scenarios.yaml

split:
  # Seconds relative to the start of each simulation run. Every split is
  # separated by an embargo of at least `prediction_horizon` seconds because
  # neighbouring samples share targets.
  train_end: 1800
  validation_start: 2105
  validation_end: 2700
  test_start: 3005
  test_end: 3300 # duration - prediction_horizon; the last valid target
  embargo_seconds: 300

features:
  # F0 current counts; F1 + count lags/rolling; F2 + congestion measures;
  # F3 + signal state; F4 + cross-direction imbalance. See src/preprocessing/features.py.
  default_set: F4
  # Drop the first `warmup_seconds` of each run so every row has the full lag
  # and rolling history available.
  warmup_seconds: 300

output:
  dataset: sl_dataset.csv
  feature_map: feature_columns.json
  audit: data_audit.json

models:
  # Per-candidate settings consumed by `python -m src.supervised.train`.
  # `params` are merged over the registry defaults; `grid` (optional) is the
  # --tune search space, searched with expanding time-block CV (300 s
  # embargo, all runs in every fold — see time_block_folds in train.py).
  # `--seed` overrides random_state for seeded models.
  ridge:
    params:
      alpha: 1.0
  decision_tree:
    params:
      max_depth: 12
      min_samples_leaf: 5
    grid:
      max_depth: [6, 12, 18, null]
      min_samples_leaf: [1, 5, 20]
  random_forest:
    params:
      n_estimators: 300
      max_depth: 16
      min_samples_leaf: 2
    grid:
      n_estimators: [200, 300]
      max_depth: [12, 16, null]
      min_samples_leaf: [1, 2, 4]
  hist_gradient_boosting:
    params:
      max_iter: 300
      learning_rate: 0.08
      # Match the frozen chronological splits: sklearn's default
      # early_stopping="auto" would carve a random 10% holdout out of the
      # ordered training rows (SIM/SL review issue SL-1).
      early_stopping: false
    grid:
      max_iter: [200, 300]
      learning_rate: [0.05, 0.08, 0.12]
  xgboost:
    params:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 6
    grid:
      n_estimators: [200, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]
  persistence:
    params: {}
